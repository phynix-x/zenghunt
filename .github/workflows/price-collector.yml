name: ZenGhunt Price Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZENGHUNT_FEED_AMAZON_URL: ${{ secrets.ZENGHUNT_FEED_AMAZON_URL }}
          ZENGHUNT_FEED_AMAZON_TOKEN: ${{ secrets.ZENGHUNT_FEED_AMAZON_TOKEN }}
          ZENGHUNT_FEED_FLIPKART_URL: ${{ secrets.ZENGHUNT_FEED_FLIPKART_URL }}
          ZENGHUNT_FEED_FLIPKART_TOKEN: ${{ secrets.ZENGHUNT_FEED_FLIPKART_TOKEN }}
          ZENGHUNT_FEED_MYNTRA_URL: ${{ secrets.ZENGHUNT_FEED_MYNTRA_URL }}
          ZENGHUNT_FEED_MYNTRA_TOKEN: ${{ secrets.ZENGHUNT_FEED_MYNTRA_TOKEN }}
          ZENGHUNT_FEED_AJIO_URL: ${{ secrets.ZENGHUNT_FEED_AJIO_URL }}
          ZENGHUNT_FEED_AJIO_TOKEN: ${{ secrets.ZENGHUNT_FEED_AJIO_TOKEN }}
          ZENGHUNT_FEED_MEESHO_URL: ${{ secrets.ZENGHUNT_FEED_MEESHO_URL }}
          ZENGHUNT_FEED_MEESHO_TOKEN: ${{ secrets.ZENGHUNT_FEED_MEESHO_TOKEN }}
          ZENGHUNT_FEED_TATACLIQ_URL: ${{ secrets.ZENGHUNT_FEED_TATACLIQ_URL }}
          ZENGHUNT_FEED_TATACLIQ_TOKEN: ${{ secrets.ZENGHUNT_FEED_TATACLIQ_TOKEN }}
          ZENGHUNT_FEED_CROMA_URL: ${{ secrets.ZENGHUNT_FEED_CROMA_URL }}
          ZENGHUNT_FEED_CROMA_TOKEN: ${{ secrets.ZENGHUNT_FEED_CROMA_TOKEN }}
          ZENGHUNT_FEED_RELIANCEDIGITAL_URL: ${{ secrets.ZENGHUNT_FEED_RELIANCEDIGITAL_URL }}
          ZENGHUNT_FEED_RELIANCEDIGITAL_TOKEN: ${{ secrets.ZENGHUNT_FEED_RELIANCEDIGITAL_TOKEN }}
        run: python -m collector.main
