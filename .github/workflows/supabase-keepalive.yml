name: ZenGhunt Supabase Keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Generate real database activity
        env:
          SUPABASE_URL: https://bztvvonpexothabbqjqy.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_wQ6uzly0A4dVEu5xvxzl1A_89uhAzpK
        run: |
          set -euo pipefail

          echo "Checking Supabase REST API..."
          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            "${SUPABASE_URL}/rest/v1/products?select=id&limit=1" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Accept: application/json"

          echo
          echo "Supabase keepalive query completed successfully."
