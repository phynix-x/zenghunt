<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — ZenGhunt</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header><div class="wrap nav"><a class="brand" href="index.html">ZenGhunt<span> Deals</span></a><nav class="navlinks"><a href="index.html">Search</a><a href="index.html#deals">Hot Deals</a><a href="about.html">About</a></nav></div></header>
<main><section class="hero"><div class="wrap"><a class="muted" href="index.html">← Back to deals</a><h1 id="name" style="margin-top:18px">Product</h1><p id="store"></p></div></section>
<section class="wrap section"><div class="compare"><table id="compareTable"></table></div></section>
<section class="wrap section"><div class="section-head"><h2>Price history</h2><span class="muted">Illustrative data until live price-history data is connected</span></div><div class="history"><div id="chart" class="chart"></div><div class="legend"><span>Older</span><span>Current: ₹999</span></div></div></section></main>
<footer><div class="wrap">© 2026 ZenGhunt · <a href="privacy.html">Privacy</a> · <a href="disclosure.html">Affiliate Disclosure</a></div></footer>
<script src="assets/app.js"></script><script>
document.addEventListener("DOMContentLoaded",()=>{const id=new URLSearchParams(location.search).get("id")||"dyazo";const p=PRODUCTS.find(x=>x.id===id)||PRODUCTS[0];document.title=p.name+" — ZenGhunt";document.querySelector("#name").textContent=p.name;document.querySelector("#store").textContent=p.store+" · ★ "+p.rating+"/5 · "+p.reviews.toLocaleString("en-IN")+" ratings";document.querySelector("#compareTable").innerHTML=`<tr><th>Store</th><th>Current price</th><th>Previous/MRP</th><th>Discount</th><th>Action</th></tr><tr><td>${p.store}</td><td class="lowest">${money(p.price)}</td><td><s>${money(p.mrp)}</s></td><td>${p.deal}</td><td><a class="btn" href="${p.affiliate}" target="_blank" rel="nofollow sponsored noopener">Buy now</a></td></tr><tr><td>Price history</td><td colspan="4">Lowest shown in this demo: <strong>${money(Math.min(...history))}</strong></td></tr>`;});</script></body></html>
