<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — ZenGhunt</title><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="wrap nav"><a class="brand" href="index.html">Zen<span>Ghunt</span> Deals</a><nav class="navlinks"><a href="index.html">Deals</a><a href="about.html">About</a></nav></div></header><main class="wrap section"><div id="detail" class="detail"><div class="empty">Loading live product data…</div></div></main><footer><div class="wrap">ZenGhunt · <a href="disclosure.html">Affiliate Disclosure</a></div></footer><script src="assets/config.js"></script><script src="assets/api.js"></script><script>
const id=new URLSearchParams(location.search).get('id');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function img(url,name){return `<img src="${esc(url||'')}" alt="${esc(name)}" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22450%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23f7f8fa%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23939aa1%22 font-family=%22Arial%22 font-size=%2220%22%3ENo image%3C/text%3E%3C/svg%3E'">`}
function latestListing(l){const prices=(l.prices||[]).sort((a,b)=>new Date(b.checked_at)-new Date(a.checked_at));return {...l,store:l.stores||{},latest:prices[0]};}
function chart(points){if(points.length<2)return '<div class="empty">Price history will appear after ZenGhunt records at least two price checks.</div>';const w=900,h=260,p=28,min=Math.min(...points),max=Math.max(...points),range=max-min||1;const pts=points.map((v,i)=>{const x=p+i*(w-2*p)/(points.length-1),y=24+(max-v)*205/range;return[x,y,v]});const line=pts.map((a,i)=>(i?'L':'M')+a[0].toFixed(1)+' '+a[1].toFixed(1)).join(' ');const area=line+` L ${pts.at(-1)[0]} 235 L ${pts[0][0]} 235 Z`;return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Price history chart"><path d="${area}" fill="#f1f3f5"/><path d="${line}" fill="none" stroke="#172a3a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="4" fill="#fff" stroke="#172a3a" stroke-width="2"/>`).join('')}</svg>`}
async function load(){try{if(!id)throw Error('missing id');const p=await ZenGhuntAPI.getProduct(id);if(!p)throw Error('not found');const listings=p.product_listings.map(latestListing).filter(l=>l.latest&&Number(l.latest.price)>0);const historyRows=await Promise.all(listings.map(l=>ZenGhuntAPI.getHistory(l.id)));const allHistory=historyRows.flat().sort((a,b)=>new Date(a.recorded_at)-new Date(b.recorded_at));const history=allHistory.map(x=>Number(x.price)).filter(Boolean);const offers=listings.map(l=>({store:l.store.name||'Store',price:Number(l.latest.price),mrp:Number(l.latest.mrp||0),buyUrl:l.product_url,checkedAt:l.latest.checked_at})).sort((a,b)=>a.price-b.price);const best=offers[0];const previous=history.length>1?history.at(-2):null;const lowest=history.length?Math.min(...history):best.price;const average=history.length?Math.round(history.reduce((a,b)=>a+b,0)/history.length):best.price;const discount=best.mrp>best.price?Math.round((best.mrp-best.price)/best.mrp*100):Number(best.latest?.discount_percent||0);document.title=p.name+' — ZenGhunt';document.querySelector('#detail').innerHTML=`<div class="product-head"><div class="product-image">${img(p.image_url||best.image_url,p.name)}</div><div><div class="store">${esc(p.brand||'')} · ${esc(p.category||'')}</div><h1>${esc(p.name)}</h1><div><span class="big-price">${money(best.price)}</span>${best.mrp?` <span class="mrp">${money(best.mrp)}</span>`:''}${discount?` <span class="off">${discount}% OFF</span>`:''}</div><p>${offers.length} live store offer${offers.length===1?'':'s'} · Last checked ${new Date(best.checkedAt).toLocaleString('en-IN')}</p><div class="stats"><div class="stat"><small>Previous check</small><strong>${previous===null?'—':money(previous)}</strong></div><div class="stat"><small>Lowest recorded</small><strong>${money(lowest)}</strong></div><div class="stat"><small>Average</small><strong>${money(average)}</strong></div></div><a class="btn" href="${esc(best.buyUrl)}" target="_blank" rel="nofollow sponsored noopener">Buy at ${esc(best.store)} →</a></div></div><div class="chartbox"><h2>Price history</h2><p class="note">Only prices actually recorded by ZenGhunt are plotted here.</p>${chart(history)}<div class="chart-labels"><span>${allHistory.length?new Date(allHistory[0].recorded_at).toLocaleDateString('en-IN'):'—'}</span><span>${allHistory.length?new Date(allHistory.at(-1).recorded_at).toLocaleDateString('en-IN'):'—'}</span></div></div><div class="chartbox"><h2>Compare offers</h2><table class="offers"><tr><th>Store</th><th>Price</th><th>Checked</th><th></th></tr>${offers.map((x,i)=>`<tr class="${i===0?'best':''}"><td>${esc(x.store)}${i===0?' · Best':''}</td><td>${money(x.price)}</td><td>${new Date(x.checkedAt).toLocaleDateString('en-IN')}</td><td><a class="btn" href="${esc(x.buyUrl)}" target="_blank" rel="nofollow sponsored noopener">Buy →</a></td></tr>`).join('')}</table></div><div class="chartbox"><h2>Price alert</h2><p class="note">Alert saving will be connected through the secure backend in the next phase. No browser-side secret is required.</p><div class="alert"><input id="target" type="number" min="1" placeholder="Target price"><button class="btn" id="alertBtn" type="button">🔔 Set alert</button></div></div>`}catch(e){console.error(e);document.querySelector('#detail').innerHTML='<div class="empty">Live product data could not be loaded. Make sure this product exists in Supabase and the URL contains a valid product id.</div>'}}
load();
</script></body></html>
